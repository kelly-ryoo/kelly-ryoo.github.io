name: Sync zines from Google Drive

on:
  schedule:
    - cron: '23 9 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install sync dependencies
        run: python -m pip install -r requirements.txt

      - name: Sync zines
        run: python scripts/sync_zines.py

      - name: Commit changed zines
        run: |
          git add public/data/zines.json public/zines/
          if git diff --cached --quiet; then
            echo "Zine collection is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update zine collection"
          git push