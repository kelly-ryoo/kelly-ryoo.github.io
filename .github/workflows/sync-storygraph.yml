name: Sync StoryGraph bookshelf

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install sync dependencies
        run: python -m pip install -r requirements.txt

      - name: Sync StoryGraph shelves
        run: python scripts/sync_storygraph.py
        env:
          STORYGRAPH_COOKIE: ${{ secrets.STORYGRAPH_COOKIE }}

      - name: Commit changed bookshelf
        run: |
          if git diff --quiet -- public/data/bookshelf.json; then
            echo "No bookshelf changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/bookshelf.json
          git commit -m "Update StoryGraph bookshelf"
          git push