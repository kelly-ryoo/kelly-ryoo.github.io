name: Sync Goodreads read shelf

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install sync dependencies
        run: python -m pip install -r requirements.txt

      - name: Sync Goodreads read shelf
        run: python scripts/sync_goodreads.py
        env:
          NOCODEAPI_CLOUD_NAME: ${{ secrets.NOCODEAPI_CLOUD_NAME }}
          NOCODEAPI_TOKEN: ${{ secrets.NOCODEAPI_TOKEN }}

      - name: Commit changed bookshelf
        run: |
          if git diff --quiet -- public/data/bookshelf.json; then
            echo "Goodreads read shelf is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/bookshelf.json
          git commit -m "Update Goodreads read shelf"
          git push