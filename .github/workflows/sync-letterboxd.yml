name: Sync Letterboxd films

on:
  schedule:
    - cron: '37 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install sync dependencies
        run: python -m pip install -r requirements.txt

      - name: Sync Letterboxd films
        run: python scripts/sync_letterboxd.py

      - name: Commit changed films
        run: |
          if git diff --quiet -- public/data/letterboxd.json; then
            echo "Letterboxd feed is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/letterboxd.json
          git commit -m "Update Letterboxd feed"
          git push